<!DOCTYPE html>
<html lang="ja">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Fr0z Official Website</title>
 <style>
 /* 基本設定 */
 * {
 box-sizing: border-box;
 scroll-behavior: smooth;
 }
 body {
 margin: 0;
 font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
 background-color: #0b0f19;
 color: #e2e8f0;
 line-height: 1.7;
 }
 a {
 color: #38bdf8;
 text-decoration: none;
 }

 /* 上部ナビゲーションバー */
 header {
 position: sticky;
 top: 0;
 background-color: rgba(11, 15, 25, 0.9);
 backdrop-filter: blur(8px);
 border-bottom: 1px solid #1e293b;
 z-index: 100;
 }
 .nav-container {
 max-width: 900px;
 margin: 0 auto;
 padding: 15px 20px;
 display: flex;
 justify-content: space-between;
 align-items: center;
 }
 .logo {
 font-size: 20px;
 font-weight: bold;
 color: #ffffff;
 letter-spacing: 1px;
 }
 nav a {
 color: #cbd5e1;
 margin-left: 20px;
 font-size: 14px;
 transition: color 0.2s;
 }
 nav a:hover {
 color: #38bdf8;
 }

 /* メインビジュアル(ヒーローエリア) */
 .hero {
 text-align: center;
 padding: 100px 20px;
 background: radial-gradient(circle at center, #1e293b 0%, #0b0f19 70%);
 }
 .hero h1 {
 font-size: 42px;
 margin: 0 0 15px;
 color: #ffffff;
 letter-spacing: 2px;
 }
 .hero p {
 font-size: 16px;
 color: #94a3b8;
 max-width: 600px;
 margin: 0 auto;
 }

 /* 各セクション共通 */
 section {
 max-width: 900px;
 margin: 0 auto;
 padding: 60px 20px;
 border-bottom: 1px solid #1e293b;
 }
 h2 {
 font-size: 24px;
 color: #ffffff;
 margin-bottom: 25px;
 border-left: 4px solid #38bdf8;
 padding-left: 12px;
 }

 /* 作品・活動カード */
 .grid {
 display: grid;
 grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
 gap: 20px;
 }
 .card {
 background-color: #151c2c;
 border: 1px solid #1e293b;
 border-radius: 12px;
 padding: 20px;
 transition: transform 0.2s, border-color 0.2s;
 }
 .card:hover {
 transform: translateY(-4px);
 border-color: #38bdf8;
 }
 .card h3 {
 margin: 0 0 10px;
 font-size: 18px;
 color: #ffffff;
 }
 .card p {
 font-size: 14px;
 color: #94a3b8;
 margin: 0;
 }

 /* リンクボタン */
 .social-links {
 display: flex;
 flex-wrap: wrap;
 gap: 15px;
 }
 .btn {
 display: inline-block;
 background-color: #1e293b;
 color: #ffffff;
 padding: 12px 24px;
 border-radius: 8px;
 border: 1px solid #334155;
 font-weight: bold;
 transition: background-color 0.2s, border-color 0.2s;
 }
 .btn:hover {
 background-color: #38bdf8;
 color: #0b0f19;
 border-color: #38bdf8;
 }

 /* フッター */
 footer {
 text-align: center;
 padding: 40px 20px;
 font-size: 13px;
 color: #64748b;
 }
 </style>
</head>
<body>

 <!-- 上部メニュー -->
 <header>
 <div class="nav-container">
 <div class="logo">Fr0z HP</div>
 <nav>
 <a href="#about">About</a>
 <a href="#works">Works</a>
 <a href="#links">Links</a>
 </nav>
 </div>
 </header>

 <!-- トップ看板 -->
 <div class="hero">
 <h1>Welcome to Fr0z's Site</h1>
 <p>ここはFr0zの公式ホームページです。Youtubeの動画の告知や活動などを載せています。</p>
 </div>

 <!-- 自己紹介 -->
 <section id="about">
 <h2>About / プロフィール</h2>
 <p>
 はじめまして、Fr0zです。<br>
 YoutubeでマイクラPVPの動画を出しています。<br>
 </p>
 </section>

 <!-- 作品・活動紹介 -->
 <section id="works">
 <h2>Works / 活動状況</h2>
 <div class="grid">
 <div class="card">
 <h3>プロジェクト 01</h3>
 <p></p>
 </div>
 <div class="card">
 <h3>プロジェクト 02</h3>
 <p></p>
 </div>
 <div class="card">
 <h3>Coming Soon</h3>
 <p>現在新しい動画を作成中です。</p>
 </div>
 </div>
 </section>

 <!-- 各種リンク -->
 <section id="links">
 <h2>コミュニュティーとSNS</h2>
 <div class="social-links">
 <a href="https://www.youtube.com/@Fr0Z0212" target="_blank" class="btn">公式YouTube</a>
 <a href="https://www.discord.gg/KakKJsZKtK" target="_blank" class="btn">公式Discord</a>
 </div>
 </section>

 <!-- フッター -->
 <footer>
 &copy; 2026 Fr0z. All Rights Reserved.
 </footer>

</body>
</html>
